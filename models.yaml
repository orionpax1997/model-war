# 本季参赛模型集(hld §2.2.6)。
#
# ── 这份文件的定位 ──
#
# 唯一用户面是 `modelwar gen --config models.yaml`:只登记**本季参赛集**,不是把服务商的
# 全量目录(85 条)当配置长期维护。一条模型一个条目,接入同端点族的新模型只加一条配置、不改代码。
#
# ── 字段 ──
#
# 必填五项:slug(存档目录以它分家,须唯一)、endpointFamily(chat-completions / messages /
# responses)、baseUrl、modelId(透传给端点的模型标识,按端点 /models 返回的 id 原样填)、credentialEnvVar(凭证只从环境变量读)。
# 可选项:contextLength(契约 token 预算核对)、protocolRounds(模型调用总轮数,含第 1 轮,
# 缺省 5)、strategy(策略取向一行文,缺省则模板里 {{strategy}} 整段不注入)、params(透传端点族的
# 请求参数)。
#
# ── 本季参赛集(8+1+2 条) ──
#
# 前八条走 opencode go 订阅端点;末三条走直连/中转(其中 opus 经 yomiapi 中转)。Command Code 订阅已到期,本季不再用。
# baseUrl 一条通吃三端点族,端点路径由 endpointFamily 决定(族→路径映射见 gen/src/http/endpoints.ts)。
# 十一条 strategy 注入**同一句**(赛模型,不赛策略;策略是常量才赛得出模型差异)。

models:
  - slug: deepseek-v4.1-flash
    endpointFamily: chat-completions
    baseUrl: https://opencode.ai/zen/go/v1
    modelId: deepseek-v4.1-flash
    credentialEnvVar: OPENCODE_GO_API_KEY
    protocolRounds: 5
    strategy: 扩张运营:先稳住经济与点位,攒够家底再转军事,按 tick 节奏推进不冒进。
    params:
      temperature: 0

  - slug: gpt-6-luna
    endpointFamily: responses
    baseUrl: https://opencode.ai/zen/go/v1
    modelId: gpt-6-luna
    credentialEnvVar: OPENCODE_GO_API_KEY
    protocolRounds: 5
    strategy: 扩张运营:先稳住经济与点位,攒够家底再转军事,按 tick 节奏推进不冒进。
    # 注意:该模型在 opencode go 上不支持 temperature(透传即 400),params 整段不填。

