# 主流水线(快链):PR 开/更新/重开与合入 main 时跑 `verify` + `gate:types`。
#
# ── 只调命名脚本 ──
# 每个 run 步都是 `pnpm run <script>`:CI 的失败信号只有一个来源——那条命名脚本本身
# (ADR-0010「CI 失败等价于命名脚本失败」)。yaml 里不写裸命令,也不设「CI 专属」断言。
#
# ── 无凭证、离线可跑 ──
# 全部 step 只有 checkout / setup / `pnpm install` / 命名脚本,没有一处凭证引用。
# 版本与写法见 ADR-0010;pnpm 版本由 packageManager 决定。

name: fast

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 只读源码,最小权限;fork PR 拿到的 token 本来也只读,流水线里不出现任何凭证引用。
permissions:
  contents: read

# 连推三次不跑三遍。只在 PR 上取消:合入 main 的那次必须跑完,否则会被后续 push 取消掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: 快链(verify + gate:types)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— 不是「多下点历史更保险」,是判据的前提。
      # `check` 以 `main` 与 HEAD 的共同祖先为基准;默认的 `fetch-depth: 1` 只有一条截断的历史,
      # 算不出共同祖先(`check` 会以 MergeBaseError 红在第一步)。
      # 另:`pull_request` 上检的是 detached 的 merge ref,本地没有 `main`(只有 `origin/main`),
      # 而远端分支也得靠全量 fetch 才会落成 `origin/*`。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 必须先上 PATH:下面 setup-node 的 cache: pnpm 会 shell out 跑 `pnpm store path`,
      # 顺序反了直接失败。省略 version → 读 package.json 的 packageManager(pnpm@12.8.1)。
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile:CI 装出来的依赖树必须与 lockfile 一致,不能在这里悄悄改。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 一步跑完整条收口链。
      #
      # 曾经拆成 `quick` / `test` 两个 step 为了归因,但 GitHub 不能单独重跑某个 step(只能重跑整个
      # job),两个 step 的实际作用只是「一眼看出哪类挂了」——日志同样给得出。代价却是链定义有两份:
      # 链的家在 `package.json`(ADR-0010「CI 失败等价于命名脚本失败」),而 yaml 里再展开一遍,
      # 于是给链加一条腿 CI 不会跟、也没有断言会红。
      #
      # 现在 yaml 只出现一个名字 `check --full`;这条链自己住 `scope/check.ts` 的 `FULL_CHAIN`,
      # 本地与 CI 同一个定义、同一措辞(ADR-0038「一条命令,没有档位」)。
      - name: check --full
        run: pnpm run check -- --full
