# 本赛季 `season.yaml`——10 模型自由策略赛季(S2)。
#
# 字段真源在 `packages/runner/src/season-config.ts`(纯装载器 + 校验)。`participants` 指向
# 各自批次的冻结存档:自由策略 gen 批次(`runId = 2026-10-11T12-43-20-061Z` 整批 9 条 +
# glm-5.3-flash 单跑 `2026-10-11T14-55-32-019Z`),10 条 `meta.ruleset` 皆为 v2。
# `step-5-preview` 缺席:opencode 上该端口持续 429(`Endpoint is unavailable`,两批 8 连挂),
# 待端口恢复后单跑冻结,再打 11 家完整季。混 runId 可跑:入场校验只认
# `meta.ruleset` 与字节自洽,不认同批次。
#
# 本季脚本全在**无策略注入**下生成(决定见 docs/adr/0013),与上一季(11 模型统一策略句,
# 运行标识 2026-10-11T11-10-03-696Z)口径不同,排名不可跨季对比。
#
# 规模:N=10,M=1,K=4,`M × K = 4 ≡ 0 (mod 4)` ✓ ⇒ 对局总数 `C(10,4) × 1 × 4 = 840`,
# 每模型出场 `C(9,3) × 1 × 4 = 336` 局。M 取 1 而不取 2 的原因:M=2,K=2 虽过门禁,
# 但座位轮换取值是 {0,1,1,2},第 4 档永远用不到;M=1,K=4 取满 {0,1,2,3},四座位精确均摊。
# 地图只留一张是精简代价:全量 M=3,K=4 要 2520 局(约 50 分钟/7GB),以后想加再加。
#
# ── 为什么用块序列而非内联 `[a, b, c]` ──
#
# `season.yaml` 由 runner 私有的 YAML 子集读取器解析,它**不支持非空流式数组/映射**,
# 所以 `rankPoints` / `maps` 一律写成多行块序列(每项一行 `- x`)。

# ── 必填字段 ──

# 赛季根种子:决定全部对局种子的源头(`种子 = H(masterSeed, combo, mapIndex, seedIndex)`)。
# 新赛季换新种子:N 变了组合全变,种子本就全变,换个名字标记清楚。
masterSeed: "2026-s2"

# 赛季唯一规则版本;须与当前 `RULESET_VERSION`(v2)一致,否则装载期拒跑。
ruleset: v2

# ── 选填字段 ──

# 并发上限;本机为 8 核,取 min(cpus, 8) 的上界。
concurrency: 8

# 名次积分表:第 i 项 = 第 i+1 名的分值,固定 4 项(四方对局);不进 rulesets/。
rankPoints:
  - 3
  - 2
  - 1
  - 0

# 地图池(引用 maps/ 下的 slug);精简赛季只留一张,M × K = 1 × 4 = 4 ≡ 0 (mod 4) ✓。
maps:
  - corridor-split

# 种子数 K。
seeds: 4

# 参赛存档引用(archive/<slug>/<runId>);名册去重后按 slug 升序参与枚举,文件里的顺序只影响排名表行序。
# 9 条同属一次自由策略 gen 批次(共享 runId),glm 是单跑批次(一个 runId),
# 十条均 `meta.validation.passed = true` 且 `meta.ruleset = v2`。
participants:
  - archive/claude-haiku-5-5/2026-10-11T12-43-20-061Z
  - archive/claude-opus-5-5/2026-10-11T12-43-20-061Z
  - archive/deepseek-v4.1-flash/2026-10-11T12-43-20-061Z
  - archive/glm-5.3-flash/2026-10-11T14-55-32-019Z
  - archive/gpt-6-luna/2026-10-11T12-43-20-061Z
  - archive/gpt-6.1-sol/2026-10-11T12-43-20-061Z
  - archive/mimo-v2.6-flash/2026-10-11T12-43-20-061Z
  - archive/mimo-v2.6-pro/2026-10-11T12-43-20-061Z
  - archive/minimax-m3.1-flash/2026-10-11T12-43-20-061Z
  - archive/muse-spark-1.3-contributor/2026-10-11T12-43-20-061Z
